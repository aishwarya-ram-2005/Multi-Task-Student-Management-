{% extends "base.html" %}{% block content %}<div class="pagehead"><div><p class="eyebrow">RECORD FORM</p><h1>{{'Edit' if record else 'Add'}} · {{title}}</h1></div><a class="btn secondary" href="{{url_for('listing',table=table)}}">Back</a></div><form class="panel formpanel" method="post">{% for key,label in fields %}<label>{{label}}{% if key == 'description' or key == 'question' %}<textarea name="{{key}}" required>{{record[key] if record else ''}}</textarea>{% else %}<input name="{{key}}" value="{{record[key] if record else ''}}" required>{% endif %}</label>{% endfor %}<button class="btn">Save Record</button></form>{% endblock %}
