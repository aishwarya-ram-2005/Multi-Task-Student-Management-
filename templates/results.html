{% extends "base.html" %}{% block content %}<div class="pagehead"><div><p class="eyebrow">ASSESSMENT HISTORY</p><h1>Exam Results</h1></div></div><div class="panel tablewrap"><table><thead><tr><th>Student</th><th>Score</th><th>Total</th><th>Date</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.student_name}}</td><td>{{r.score}}</td><td>{{r.total}}</td><td>{{r.created_at}}</td></tr>{% else %}<tr><td colspan="4" class="empty">No exam results yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
