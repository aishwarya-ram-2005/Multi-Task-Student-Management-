{% extends "base.html" %}{% block content %}<div class="pagehead"><div><p class="eyebrow">LIBRARY MODULE</p><h1>Issue / Return History</h1></div><a class="btn secondary" href="{{url_for('listing',table='books')}}">Back to Books</a></div><div class="panel tablewrap"><table><thead><tr><th>Book</th><th>Borrower</th><th>Action</th><th>Date</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.title or 'Deleted book'}}</td><td>{{r.student_name}}</td><td>{{r.action}}</td><td>{{r.created_at}}</td></tr>{% else %}<tr><td colspan="4" class="empty">No transactions yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
